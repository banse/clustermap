# deploy.conf — deploy CLUSTERMAP to https://clustermap.vibingco.de on the IONOS VPS.
#
# Uploads this repo's source to ionos-vps:/opt/vibingco/clustermap; the vibingco compose
# (/opt/vibingco/infra/docker-compose.yml, service `clustermap`) builds the Dockerfile there
# (Vite dashboard + Python/uv runtime in one image) and runs the single container behind
# the portal's Caddy, which owns the `clustermap.vibingco.de` host and proxies everything to
# it — the app serves both /api/v1/* and the SPA. Keyless + read-only: no secrets, no
# env file, the dataset is the committed snapshot in data/. Full runbook:
#   /Library/Vibes/vibingco/infra/README.md   (section "clustermap")
#
#   /Library/Vibes/utils/deploy/deploy-app.sh --dry-run --yes   # preview (writes nothing)
#   /Library/Vibes/utils/deploy/deploy-app.sh --yes             # upload + rebuild clustermap

DOMAIN=vibingco.de
APP_NAME=clustermap              # -> /opt/vibingco/clustermap   (URL: https://clustermap.vibingco.de/)
SRC_DIR=.                      # ship source; the image builds on the VPS
# One image, one container — rebuilding it never touches otter/cred/0xtxt.
POST_DEPLOY_CMD="cd /opt/vibingco/infra && docker compose up -d --build clustermap"
VERIFY_URL="https://clustermap.vibingco.de/api/v1/health"

# Ship source only: keep pyproject.toml + uv.lock + vendor/sybilkit (pinned SybilKit) +
# src/ + data/ (the snapshot) + dashboard/{src,public,index.html,package*.json,*.config.ts,
# tsconfig.json}. Drop local envs/caches, installed deps, build output, tests, screenshots,
# the MaxPane checkout under third_party/, and every .env.
# (DEFAULT_EXCLUDES already covers node_modules, .git, .env, .DS_Store, deploy.conf.)
EXCLUDES=( "${DEFAULT_EXCLUDES[@]}" .venv .playwright-cli .pytest_cache .ruff_cache \
           __pycache__ '*.pyc' dashboard/dist dashboard/playwright-report dashboard/test-results \
           output screenshots third_party tests dashboard/tests .claude MEMORY.md '.env*' '*.png' )
