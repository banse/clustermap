[project]
name = "clustermap"
version = "0.1.0"
description = "Read-only CuratorWhitelist wallet relationship map powered by SybilKit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sybilkit",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
clustermap = "clustermap.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clustermap"]

[tool.uv.sources]
sybilkit = { path = "vendor/sybilkit", editable = true }

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

